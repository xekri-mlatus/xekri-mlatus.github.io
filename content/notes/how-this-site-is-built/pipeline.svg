<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 200" width="950" height="200" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>How the site is built: content goes through Hugo into public/, which GitHub Pages serves</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a90a0"/>
    </marker>
  </defs>
  <rect width="950" height="200" rx="12" fill="#f4f5f7"/>
  <rect x="30" y="45" width="180" height="110" rx="10" fill="#ffffff" stroke="#3a3f4b" stroke-width="1.5"/><text x="120.0" y="85" text-anchor="middle" font-size="18" font-weight="700" fill="#3a3f4b">content/</text><text x="120.0" y="111" text-anchor="middle" font-size="13" fill="#5b6170">Markdown notes</text><text x="120.0" y="129" text-anchor="middle" font-size="13" fill="#5b6170">and images</text><path d="M218,100.0 h28" stroke="#8a90a0" stroke-width="2" marker-end="url(#arrow)"/><rect x="260" y="45" width="180" height="110" rx="10" fill="#ffffff" stroke="#2f6fdb" stroke-width="2.5"/><text x="350.0" y="85" text-anchor="middle" font-size="18" font-weight="700" fill="#2f6fdb">Hugo</text><text x="350.0" y="111" text-anchor="middle" font-size="13" fill="#5b6170">+ PaperMod theme</text><text x="350.0" y="129" text-anchor="middle" font-size="13" fill="#5b6170">renders templates</text><path d="M448,100.0 h28" stroke="#8a90a0" stroke-width="2" marker-end="url(#arrow)"/><rect x="490" y="45" width="180" height="110" rx="10" fill="#ffffff" stroke="#3a3f4b" stroke-width="1.5"/><text x="580.0" y="85" text-anchor="middle" font-size="18" font-weight="700" fill="#3a3f4b">public/</text><text x="580.0" y="111" text-anchor="middle" font-size="13" fill="#5b6170">plain HTML, CSS,</text><text x="580.0" y="129" text-anchor="middle" font-size="13" fill="#5b6170">JS and images</text><path d="M678,100.0 h28" stroke="#8a90a0" stroke-width="2" marker-end="url(#arrow)"/><rect x="720" y="45" width="180" height="110" rx="10" fill="#ffffff" stroke="#3a3f4b" stroke-width="1.5"/><text x="810.0" y="85" text-anchor="middle" font-size="18" font-weight="700" fill="#3a3f4b">GitHub Pages</text><text x="810.0" y="111" text-anchor="middle" font-size="13" fill="#5b6170">serves the files</text><text x="810.0" y="129" text-anchor="middle" font-size="13" fill="#5b6170">to readers</text><text x="465.0" y="90.0" text-anchor="middle" font-size="11" fill="#8a90a0" font-family="ui-monospace, Consolas, monospace">hugo</text><text x="695.0" y="90.0" text-anchor="middle" font-size="11" fill="#8a90a0" font-family="ui-monospace, Consolas, monospace">git push</text>
</svg>
