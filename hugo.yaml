baseURL: https://xekri-mlatus.github.io/
locale: en-us
title: Mlatus' notes
theme: mlatus  # themes/mlatus, described in SPEC.md

enableRobotsTXT: true

# The wall and tag pages show 24 notes at a time; "Load older notes" fetches
# the next page. See params.oldPagerSize for the page numbers this retired.
pagination:
  pagerSize: 24

taxonomies:
  tag: tags

# The home page's JSON is the index the search page reads. The notes section
# has its own feed, the one the site links to.
outputs:
  home: [HTML, RSS, JSON]
  section: [HTML, RSS]
  taxonomy: [HTML, RSS]
  term: [HTML, RSS]

markup:
  highlight:
    noClasses: false  # code colours come from the theme's CSS, for light and dark
  goldmark:
    renderHooks:
      link:
        # Resolve links like /notes/foo/ to the page's real URL, so they keep
        # working when the site is served from a subfolder (as on GitHub Pages).
        useEmbedded: fallback

menu:
  main:
    - name: Notes
      pageRef: /
      weight: 10
    - name: Tags
      pageRef: /tags
      weight: 20
    - name: Artifacts
      pageRef: /artifacts
      weight: 25
    - name: Search
      pageRef: /search
      weight: 30
    - name: About
      pageRef: /about
      weight: 40

params:
  description: "Notes of Mlatus"
  author: Mlatus
  mainSections: [notes]
  # Pages used to hold 8 notes. Page numbers that existed then but not now
  # (such as /page/9/) redirect to the first page, so old links keep working.
  oldPagerSize: 8
  # Notes written before this year end with the "old note" disclaimer.
  oldNoteYear: 2025

# An artifact (content/artifacts/<name>/) is a whole HTML page next to its
# index.md. Hugo refuses HTML content files by default; allow them, so the
# artifact's layout can serve the file as it is.
security:
  allowContent: ['! ^text/org$']
