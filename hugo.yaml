baseURL: https://xekri-mlatus.github.io/
locale: en-us
title: Mlatus' notes
theme: PaperMod

enableRobotsTXT: true
pagination:
  pagerSize: 8

# Only tags — PaperMod doesn't display categories anywhere.
taxonomies:
  tag: tags

# JSON on the home page is the index the search page reads.
outputs:
  home: [HTML, RSS, JSON]

markup:
  highlight:
    noClasses: false  # PaperMod ships its own syntax colours for light and dark
  goldmark:
    renderHooks:
      link:
        # Resolve links like /notes/foo/ to the page's real URL, so they keep
        # working when the site is served from a subfolder (as on GitHub Pages).
        useEmbedded: fallback

menu:
  main:
    - name: Notes
      pageRef: /notes
      weight: 10
    - name: Archive
      pageRef: /archives
      weight: 20
    - name: Tags
      pageRef: /tags
      weight: 30
    - name: Search
      pageRef: /search
      weight: 40
    - name: About
      pageRef: /about
      weight: 50

params:
  description: "Notes of Mlatus"
  author: Mlatus
  mainSections: [notes]
  defaultTheme: auto

  # homeInfoParams:
    # Title: "Welcome to the online home of Mlatus"
    # Content: >-
      # This site is my personal collection of notes, memes, random thoughts, art and everything I find interesting or valuable.

  # Post pages
  ShowReadingTime: true
  ShowBreadCrumbs: true
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowShareButtons: true
  ShareButtons: [x, reddit, telegram]
  ShowToc: false  # turned on per note for the longer ones
  TocOpen: false

  cover:
    linkFullImages: true  # clicking a cover opens the full-size image

  # Search tuning. A low threshold keeps results close to what was typed
  # (0.4, the default, matches "lake" to "like", "make" and "take").
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    ignoreLocation: true
    threshold: 0.2
    minMatchCharLength: 2
    limit: 10
    keys: [title, summary, content]
