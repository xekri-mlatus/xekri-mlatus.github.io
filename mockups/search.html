<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search · Mlatus' notes</title>
<link rel="stylesheet" href="site.css">
<style>
.box { position: relative; margin-bottom: 18px; }
.box input { width: 100%; font: inherit; font-size: 17px; color: var(--text); background: var(--card);
  border: 1px solid var(--border); border-radius: 14px; padding: 12px 16px 12px 42px; outline: none; }
.box input:focus { border-color: var(--link); }
.box::before { content: "⌕"; position: absolute; left: 15px; top: 50%; transform: translateY(-52%);
  color: var(--meta); font-size: 20px; }
.status { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
.hit { display: flex; gap: 14px; align-items: flex-start; padding: 12px 14px; margin-bottom: 10px; color: var(--text); }
a.hit:hover { border-color: var(--link); text-decoration: none; }
.hit img { flex: none; width: 64px; height: 64px; object-fit: cover; object-position: top; border-radius: 9px; }
.hit .t { font-weight: 600; }
.hit .d { color: var(--meta); font-size: 12.5px; margin: 1px 0 4px; }
.hit .s { color: var(--muted); font-size: 14px; line-height: 1.45; }
kbd { font: 12px var(--font); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; }
</style>
</head>
<body>
<main class="page">
  <div class="box"><input id="q" type="search" placeholder="Search notes…" autocomplete="off" autofocus></div>
  <p class="status" id="status"></p>
  <div id="hits"></div>
</main>
<script src="notes.js"></script>
<script src="common.js"></script>
<script>
renderHeader("Search");
const q = document.getElementById("q"), status = document.getElementById("status"), hits = document.getElementById("hits");

// Highlight every occurrence of the query in already-escaped text.
const mark = (s, needle) => esc(s).replace(new RegExp(esc(needle).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), m => `<mark>${m}</mark>`);
function snippet(text, needle) {
  const i = text.toLowerCase().indexOf(needle.toLowerCase());
  if (i < 0) return text.slice(0, 160) + (text.length > 160 ? "…" : "");
  const from = Math.max(0, i - 60), to = Math.min(text.length, i + needle.length + 100);
  return (from > 0 ? "…" : "") + text.slice(from, to) + (to < text.length ? "…" : "");
}

function run() {
  const needle = q.value.trim();
  history.replaceState(null, "", needle ? `?q=${encodeURIComponent(needle)}` : location.pathname);
  if (needle.length < 2) {
    status.innerHTML = `Type to search ${NOTES.length} notes. Press <kbd>/</kbd> on any page to come here.`;
    hits.innerHTML = "";
    return;
  }
  const low = needle.toLowerCase();
  // Titles are never shown, so they aren't searched either: the text, then the image
  // descriptions (that's how memes without text are found). Newest first.
  const found = NOTES.map(n => {
    if (n.text.toLowerCase().includes(low)) return { n, s: snippet(n.text, needle), pic: false };
    const alt = n.alts.find(a => a.toLowerCase().includes(low));
    return alt ? { n, s: snippet(alt, needle), pic: true } : null;
  }).filter(Boolean);
  status.textContent = found.length ? plural(found.length, "note", "notes") + " found" : "Nothing found.";
  hits.innerHTML = found.map(({ n, s, pic }) => `<a class="hit card" href="${noteUrl(n)}">
      ${n.thumb ? `<img src="${n.thumb}" alt="">` : ""}
      <div style="min-width:0"><div class="d">${shortDate(n.date, false)}${pic ? " · in a picture" : ""}</div>
        <div class="s">${mark(s, needle)}</div></div></a>`).join("");
}
q.value = new URLSearchParams(location.search).get("q") || "";
q.addEventListener("input", run);
run();
</script>
</body>
</html>
