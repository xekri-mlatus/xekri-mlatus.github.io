<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Note · Mlatus' notes</title>
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="threads.css">
<style>
/* As in note.html. */
.note-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--meta); font-size: 13px; margin-bottom: 14px; }
.note-meta .tags { flex: none; }
.body { font-size: 16px; line-height: 1.6; }
.old-note { margin: 14px 0 6px; padding: 10px 14px; border-radius: 10px; background: var(--chip); color: var(--muted); font-size: 13.5px; }
.old-note p { margin: 0; }
.old-note p + p { margin-top: 4px; }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 20px; }
.pager a { display: flex; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; padding: 10px 12px; color: var(--text); min-width: 0; }
.pager a:hover { border-color: var(--link); text-decoration: none; }
.pager .older { grid-column: 2; flex-direction: row-reverse; text-align: right; }
.pager img { flex: none; width: 52px; height: 52px; object-fit: cover; object-position: top; border-radius: 8px; }
.pager .dir { color: var(--meta); font-size: 12px; }
.pager .t { font-size: 13.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.back { display: block; text-align: center; margin-top: 18px; font-size: 14px; }
@media (max-width: 560px) {
  .pager { grid-template-columns: 1fr; }
  .pager .older { grid-column: 1; }
}
</style>
</head>
<body>
<main class="page" id="page"></main>
<script src="notes.js"></script>
<script src="common.js"></script>
<script src="threads.js"></script>
<script>
renderHeader("Notes");
const page = document.getElementById("page");
const slug = new URLSearchParams(location.search).get("slug") || "mi-klama-le-zarci";
const i = NOTES.findIndex(n => n.slug === slug);

if (i < 0) {
  location.replace("404.html");
} else {
  const n = NOTES[i], newer = NOTES[i - 1], older = NOTES[i + 1];
  document.title = `${label(n, 60)} · ${SITE_NAME}`;
  const tags = m => `<span class="tags">${m.tags.map(t => `<a href="${tagUrl(t)}">#${t}</a>`).join("")}</span>`;
  const old = parts(n.date).y < 2025 ? `<aside class="old-note">
      <p lang="en">This is an old note. It may not reflect what I think and feel now.</p>
      <p lang="ru">Это старая заметка. Она может не отражать того, что я думаю и чувствую сейчас.</p></aside>` : "";

  // The whole thread: in the page from the start, shown when the address ends in #thread.
  const thread = threadOf(n);
  const showThread = `<a href="#thread"><span>Show whole thread</span><span class="n">· ${thread.length} notes</span></a>`;
  const showOne = `<a href="#">Show this note only</a>`;
  const part = (m, k) => `<article class="card${m === n ? " here" : ""}">
      <div class="note-meta">
        ${m === n ? `<span>${longDate(m.date)}</span>` : `<a class="date" href="${threadNoteUrl(m)}">${longDate(m.date)}</a>`}
        <span class="part-no">${thread.length - k} of ${thread.length}${m === n ? " · this note" : ""}</span>
        ${tags(m)}</div>
      <div class="body">${m.html}</div></article>`;
  const threadView = thread.length < 2 ? "" : `
    <section id="thread">
      <div class="thread-head"><span class="what">Thread · ${thread.length} notes</span>
        <div class="thread-toggle">${showOne}</div></div>
      <div class="parts">${[...thread].reverse().map(part).join("")}</div>
      <div class="thread-toggle">${showOne}</div>
    </section>`;

  // Titles are never shown: a neighbour is its picture, its date and the start of its text.
  const link = (m, cls, dir) => !m ? "" : `<a class="${cls}" href="${threadNoteUrl(m)}">
      ${m.thumb ? `<img src="${m.thumb}" alt="">` : ""}
      <div style="min-width:0"><div class="dir">${dir} · ${shortDate(m.date, false)}</div>
        <div class="t">${esc((m.text || m.alts[0] || "").slice(0, 140))}</div></div></a>`;

  page.innerHTML = `${threadView}
    <div class="single">
      <article class="card">
        <div class="note-meta"><span>${longDate(n.date)}</span>${tags(n)}</div>
        ${quotesAbove(n, false)}
        <div class="body">${n.html}</div>
        ${quotesBelow(n, false)}
        ${old}
        ${thread.length < 2 ? "" : `<div class="thread-toggle">${showThread}</div>`}
      </article>
    </div>
    <nav class="pager">${link(newer, "newer", "← Newer")}${link(older, "older", "Older →")}</nav>
    <a class="back" href="threads.html">All notes</a>`;
  page.querySelectorAll(".body").forEach(galleryize);
  fixLinks(page);
}
</script>
</body>
</html>
