{{- /* Visit statistics (GoatCounter, no cookies), only in the published build:
       hugo server runs in development, so local previews aren't counted. */ -}}
{{- if hugo.IsProduction }}{{ with site.Params.goatcounter }}
<script data-goatcounter="https://{{ . }}.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
{{- end }}{{ end -}}
