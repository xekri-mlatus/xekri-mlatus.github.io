{{- /* The site's icon in browser tabs and on phone home screens: the header's
       avatar, drawn by scripts/make_favicons.py into static/. The .ico is for
       browsers without SVG icons; the SVG wins where both work. */ -}}
<link rel="icon" href="{{ "favicon.ico" | relURL }}" sizes="32x32">
<link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ "apple-touch-icon.png" | relURL }}">
